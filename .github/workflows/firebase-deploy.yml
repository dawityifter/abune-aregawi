name: Deploy to Firebase Hosting on push

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'
      
      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci
        
      - name: Build
        working-directory: ./frontend
        run: npm run build:ci
        env:
          REACT_APP_API_URL: ${{ secrets.REACT_APP_API_URL }}
          REACT_APP_STRIPE_PUBLISHABLE_KEY: ${{ secrets.REACT_APP_STRIPE_PUBLISHABLE_KEY }}
          REACT_APP_FIREBASE_API_KEY: ${{ secrets.REACT_APP_FIREBASE_API_KEY }}
          REACT_APP_FIREBASE_AUTH_DOMAIN: ${{ secrets.REACT_APP_FIREBASE_AUTH_DOMAIN }}
          REACT_APP_FIREBASE_PROJECT_ID: ${{ secrets.REACT_APP_FIREBASE_PROJECT_ID }}
          REACT_APP_FIREBASE_STORAGE_BUCKET: ${{ secrets.REACT_APP_FIREBASE_STORAGE_BUCKET }}
          REACT_APP_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.REACT_APP_FIREBASE_MESSAGING_SENDER_ID }}
          REACT_APP_FIREBASE_APP_ID: ${{ secrets.REACT_APP_FIREBASE_APP_ID }}
          REACT_APP_FIREBASE_MEASUREMENT_ID: ${{ secrets.REACT_APP_FIREBASE_MEASUREMENT_ID }}
          REACT_APP_RECAPTCHA_SITE_KEY: ${{ secrets.REACT_APP_RECAPTCHA_SITE_KEY }}
          REACT_APP_ENABLE_EMAIL_AUTH: ${{ secrets.REACT_APP_ENABLE_EMAIL_AUTH }}
          REACT_APP_ENABLE_PHONE_AUTH: ${{ secrets.REACT_APP_ENABLE_PHONE_AUTH }}
          REACT_APP_YOUTUBE_SPIRITUAL_CHANNEL_ID: ${{ secrets.REACT_APP_YOUTUBE_SPIRITUAL_CHANNEL_ID }}
          REACT_APP_GALLERY_FOLDER_ID: ${{ secrets.REACT_APP_GALLERY_FOLDER_ID }}
          # Self-hosted Umami. Create React App inlines REACT_APP_* at build
          # time, so these must be present here rather than set on the server.
          # Absent or empty means the tracker never loads and the app behaves
          # exactly as it did before.
          REACT_APP_UMAMI_SRC: ${{ secrets.REACT_APP_UMAMI_SRC }}
          REACT_APP_UMAMI_WEBSITE_ID: ${{ secrets.REACT_APP_UMAMI_WEBSITE_ID }}
          # Sentry error tracking. Inlined at build time for the same reason as
          # the Umami vars above. Absent or empty means the Sentry chunk is
          # never even fetched, so members pay nothing for it.
          #
          # Not a confidentiality risk: a DSN is a write-only ingest key and
          # ends up readable in the published bundle by design. It lives in
          # secrets for consistency with everything else here, not secrecy.
          REACT_APP_SENTRY_DSN: ${{ secrets.REACT_APP_SENTRY_DSN }}
      
      # A build missing its secrets does not fail — Create React App simply
      # inlines whatever it finds, so a development .env produces a bundle that
      # looks fine and points at localhost. That shipped to members once; this
      # is the check that would have stopped it.
      - name: Verify this is a production build
        working-directory: ./frontend
        run: |
          MAIN=$(ls build/static/js/main.*.js)
          echo "checking $MAIN"
          fail=0
          if grep -q "localhost:5001" "$MAIN"; then
            echo "::error::Bundle points at localhost — REACT_APP_API_URL was missing at build time."; fail=1
          fi
          if ! grep -q "api.abunearegawi.church" "$MAIN"; then
            echo "::error::Production API URL absent from bundle."; fail=1
          fi
          if ! grep -q "pk_live" "$MAIN"; then
            echo "::error::No live Stripe key — REACT_APP_STRIPE_PUBLISHABLE_KEY was missing or is a test key."; fail=1
          fi
          if ! grep -q "analytics.abunearegawi.church" "$MAIN"; then
            echo "::error::Umami config absent — analytics would silently stop recording."; fail=1
          fi
          [ $fail -eq 0 ] && echo "production build confirmed"
          exit $fail

      - name: Deploy to Firebase
        working-directory: ./frontend
        run: npx firebase-tools deploy --only hosting --token "${{ secrets.FIREBASE_TOKEN }}"
