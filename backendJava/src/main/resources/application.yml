spring:
  application:
     name: abune-aregawi-backend-java
  profiles:
     active: local
  datasource:
     # Every value is overridable by environment so no developer's local
     # credentials are baked in. The default database is deliberately NOT the
     # working dev database — see the ddl-auto note below.
     url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/abune_aregawi_java_dev}
     username: ${DATABASE_USER:dawit}
     password: ${DATABASE_PASSWORD:}
     driver-class-name: org.postgresql.Driver
  jpa:
     hibernate:
        # NEVER 'update'. The schema belongs to the Node backend's Sequelize
        # migrations (backend/migrations, 81 of them and counting); they are the
        # single source of truth and they run automatically on every deploy.
        #
        # With ddl-auto: update, Hibernate silently ALTERs tables to match these
        # JPA entities on startup — adding columns, changing types, creating
        # indexes — with no migration file, no review and no record in
        # SequelizeMeta. Pointed at the dev database that means invisible drift;
        # pointed at production it would rewrite the parish's financial tables.
        #
        # 'validate' instead: Hibernate checks the entities against the schema
        # and refuses to start if they disagree. A mismatch becomes a loud
        # failure at boot rather than a silent migration, which is exactly the
        # signal this port needs while the entities are being brought to parity.
        ddl-auto: ${JPA_DDL_AUTO:validate}
     show-sql: false
     properties:
        hibernate:
           format_sql: true
           dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
    prometheus:
      enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    group:
      liveness:
        include: livenessState
      readiness:
        include: readinessState,db,diskSpace,firebase
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5,0.95,0.99

spring.cache:
  type: caffeine

cache:
  specs:
    members:
      ttl: 300        # seconds
      max-size: 500
    member-search:
      ttl: 60
      max-size: 200
    outreach:
      ttl: 120
      max-size: 200
    titles:
      ttl: 3600
      max-size: 50

app:
  # Demo mode (for testing without real Firebase tokens)
  enable-demo-mode: ${APP_ENABLE_DEMO_MODE:false}
  demo-token: MAGIC_DEMO_TOKEN

logging:
  level:
     church:
        abunearegawi: WARN
     org:
        springframework:
           security: ERROR
